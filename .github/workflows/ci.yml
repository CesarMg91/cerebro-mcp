name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Install
        run: uv sync

      # Tests that need the embedding model are marked `model` and run in the demo job.
      - name: Test
        run: uv run pytest -m "not model"

  demo:
    name: demo (ubuntu, with model)
    runs-on: ubuntu-latest
    env:
      # Keep every model cache the embedding runtime may use under one folder we can cache.
      HF_HOME: ${{ github.workspace }}/.model-cache/hf
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.model-cache/fastembed
      SENTENCE_TRANSFORMERS_HOME: ${{ github.workspace }}/.model-cache/st
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: .model-cache
          key: model-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            model-${{ runner.os }}-

      - name: Install
        run: uv sync

      - name: Run the demo
        run: uv run cerebro demo

      # Exit code 5 means "no tests collected": fine while there are no model tests.
      - name: Model tests
        run: uv run pytest -m model || [ $? -eq 5 ]
